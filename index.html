<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>盗版三国志</title>
<style>
  /* 中文字体:Flash 游戏内的文字依赖它(Ruffle 在浏览器里需要显式提供)
     这里把游戏可能请求的各种字体名都映射到同一份中文字体,避免"部分文字不显示" */
  @font-face { font-family: "Source Han Sans SC"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-weight: normal; font-style: normal; font-display: block; }
  @font-face { font-family: "宋体"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "SimSun"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "新宋体"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "NSimSun"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "黑体"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "SimHei"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "微软雅黑"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "Microsoft YaHei"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "楷体"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "KaiTi"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "仿宋"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "FangSong"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "_sans"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "_serif"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "_typewriter"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { width: 100%; height: 100%; }
  #stage ruffle-player, #stage embed, #stage object { width: 100% !important; height: 100% !important; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 8px; text-align: center;
    color: #aaa; font: 12px/1.5 system-ui, sans-serif; pointer-events: none;
  }
  /* 手机打字辅助面板 */
  #kbdock { position: fixed; right: 10px; bottom: 30px; z-index: 50; }
  #kbtoggle { background: rgba(30,30,30,.88); color: #eee; border: 1px solid #666;
              border-radius: 8px; padding: 9px 13px; font-size: 14px; }
  #kbpanel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
             background: rgba(18,18,18,.97); padding: 8px 8px 12px;
             border-top: 1px solid #444; }
  .kbrow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; align-items: center; }
  #kbin { flex: 1 1 130px; min-width: 110px; padding: 10px; font-size: 16px;
          border-radius: 6px; border: 1px solid #666; background: #0d0d0d; color: #eee; }
  #kbsend { padding: 10px 16px; font-size: 15px; border-radius: 6px;
            background: #2b6cb0; color: #fff; border: 0; }
  .kbk { padding: 8px 10px; font-size: 15px; border-radius: 6px; background: #333;
         color: #eee; border: 1px solid #555; min-width: 36px; }
</style>

</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<div id="hint">触摸 = 鼠标点击 · 加载中请稍候</div>

<!-- 手机打字辅助:点游戏里的输入框后,用这里的键盘把文字送进去 -->
<div id="kbdock">
  <button id="kbtoggle">⌨️ 打字</button>
</div>
<div id="kbpanel" hidden>
  <div class="kbrow">
    <input id="kbin" type="text" inputmode="text" placeholder="在这里打字(可中文)" autocomplete="off">
    <button id="kbsend">填入</button>
  </div>
  <div class="kbrow" id="kbkeys"></div>
  <div class="kbrow">
    <button class="kbk" data-op="back">← 退格</button>
    <button class="kbk" data-op="space">空格</button>
    <button class="kbk" data-op="enter">回车</button>
    <button class="kbk" data-op="close">收起</button>
  </div>
</div>

<!-- Ruffle: Flash 模拟器(WASM),同源自托管 -->
<script src="./ruffle/ruffle.js"></script>
<script>
(function () {
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    autoplay: "on",
    unmuteOverlay: "hidden",
    letterbox: "on",
    scale: "showAll",
    quality: "high",
    wmode: "direct",
    allowScriptAccess: false,
    allowNetworking: "all",
    splashScreen: false,
    contextMenu: "off",
    openUrlMode: "deny",
    logLevel: "warn",
    /* 关键:把中文字体文件交给引擎(数组=URL 列表),否则引擎找不到字体 → 文字全部丢失
       这些是"真·同名字体"(游戏按名字请求:宋体/新宋体/楷体_GB2312/仿宋_GB2312/黑体/楷体/微软雅黑/Noto Sans),
       已子集化(GB2312+ASCII)以控制体积 */
    fontSources: [
      "./fonts/RealSimSun.ttf",
      "./fonts/RealNSimSun.ttf",
      "./fonts/RealSimSunBold.ttf",
      "./fonts/GBKai.ttf",
      "./fonts/GBKaiBold.ttf",
      "./fonts/GBKaiBold2.ttf",
      "./fonts/GBFang.ttf",
      "./fonts/GBFangBold.ttf",
      "./fonts/RealHei.ttf",
      "./fonts/RealHeiBold.ttf",
      "./fonts/RealKai.ttf",
      "./fonts/RealYaHei.ttf",
      "./fonts/dev_xihei.ttf",
      "./fonts/GBKaiBold2.ttf",
      "./fonts/NotoSans_Regular.ttf",
      "./fonts/NotoSans_Bold.ttf",
      "./fonts/Default_Sans.ttf",
      "./fonts/Default_SansBold.ttf",
      "./fonts/Default_Serif.ttf",
      "./fonts/Default_SerifBold.ttf",
      "./fonts/Default_Typewriter.ttf",
      "./fonts/Default_TypewriterBold.ttf"
    ],
    /* 中文显示:引擎的默认字体位(_sans/_serif/_typewriter)必须指向"页面上真实存在的字体名" */
    defaultFonts: {
      sans:       ["黑体", "宋体", "Noto Sans", "./fonts/RealHeiBold.ttf", "./fonts/RealHei.ttf", "./fonts/RealSimSun.ttf", "./fonts/NotoSans_Regular.ttf"],
      serif:      ["宋体", "楷体", "Noto Sans", "./fonts/RealSimSunBold.ttf", "./fonts/RealSimSun.ttf", "./fonts/RealKai.ttf", "./fonts/NotoSans_Regular.ttf"],
      monospace:  ["Noto Sans", "宋体", "./fonts/NotoSans_Regular.ttf", "./fonts/RealSimSun.ttf"],
      cursive:    ["楷体", "宋体", "./fonts/RealKai.ttf", "./fonts/RealSimSun.ttf"],
      fantasy:    ["黑体", "宋体", "./fonts/RealHei.ttf", "./fonts/RealSimSun.ttf"]
    }playerEl(); if (!p) return null;
    var r = p.shadowRoot || p;
    return r.querySelector("input, textarea");
  }
  function focusInput() {
    var inp = gameInput();
    if (inp) { try { inp.focus(); } catch (e) {} }
    return inp;
  }
  function pushText(txt) {
    var inp = focusInput();
    if (inp) {                                   /* 引擎已暴露输入框:直接写入 */
      inp.value = (inp.value || "") + txt;
      ["input", "change"].forEach(function (t) {
        inp.dispatchEvent(new Event(t, { bubbles: true }));
      });
      return;
    }
    for (var i = 0; i < txt.length; i++) {        /* 退化:派发按键事件 */
      var ch = txt.charAt(i), kc = ch.charCodeAt(0);
      ["keydown", "keypress", "keyup"].forEach(function (t) {
        var ev = new KeyboardEvent(t, { key: ch, char: ch, keyCode: kc, which: kc, bubbles: true, cancelable: true });
        (document.activeElement || window).dispatchEvent(ev);
        window.dispatchEvent(ev);
      });
    }
  }
  function sendOp(op) {
    var inp = focusInput();
    var map = { back: { key: "Backspace", keyCode: 8 }, enter: { key: "Enter", keyCode: 13 }, space: { key: " ", keyCode: 32 } };
    if (inp) {
      if (op === "back") inp.value = (inp.value || "").slice(0, -1);
      else if (op === "space") inp.value = (inp.value || "") + " ";
      if (op !== "enter") inp.dispatchEvent(new Event("input", { bubbles: true }));
    }
    var m = map[op]; if (!m) return;
    ["keydown", "keyup"].forEach(function (t) {
      var ev = new KeyboardEvent(t, { key: m.key, keyCode: m.keyCode, which: m.keyCode, bubbles: true, cancelable: true });
      (document.activeElement || window).dispatchEvent(ev);
      window.dispatchEvent(ev);
    });
  }
  function initKb() {
    var panel = document.getElementById("kbpanel"), toggle = document.getElementById("kbtoggle");
    var keys = document.getElementById("kbkeys");
    if (!panel || !toggle) return;
    "abcdefghijklmnopqrstuvwxyz0123456789".split("").forEach(function (c) {
      var b = document.createElement("button");
      b.className = "kbk"; b.textContent = c;
      b.addEventListener("click", function () { pushText(c); });
      keys.appendChild(b);
    });
    toggle.addEventListener("click", function () { panel.hidden = !panel.hidden; });
    document.getElementById("kbsend").addEventListener("click", function () {
      var el = document.getElementById("kbin"); if (!el || !el.value) return;
      pushText(el.value); el.value = "";
    });
    panel.addEventListener("click", function (e) {
      var op = e.target.getAttribute && e.target.getAttribute("data-op");
      if (!op) return;
      if (op === "close") panel.hidden = true; else sendOp(op);
    });
  }

  /* 游戏按这些名字请求字体;引擎 addFont 的第一个参数必须"正好是这个名字" */
  var FONT_MAP = [
    ["黑体",        "./fonts/RealHeiBold.ttf"],
    ["黑体",        "./fonts/RealHei.ttf"],
    ["宋体",        "./fonts/RealSimSunBold.ttf"],
    ["宋体",        "./fonts/RealSimSun.ttf"],
    ["新宋体",      "./fonts/RealNSimSun.ttf"],
    ["楷体_GB2312", "./fonts/GBKaiBold.ttf"],
    ["楷体_GB2312", "./fonts/GBKai.ttf"],
    ["楷体",        "./fonts/RealKai.ttf"],
    ["华文细黑",    "./fonts/dev_xihei.ttf"],
    ["仿宋_GB2312", "./fonts/GBFangBold.ttf"],
    ["仿宋_GB2312", "./fonts/GBFang.ttf"],
    ["微软雅黑",    "./fonts/RealYaHei.ttf"],
    ["Noto Sans",   "./fonts/NotoSans_Bold.ttf"],
    ["Noto Sans",   "./fonts/NotoSans_Regular.ttf"],
    ["_sans",       "./fonts/Default_SansBold.ttf"],
    ["_sans",       "./fonts/Default_Sans.ttf"],
    ["_serif",      "./fonts/Default_SerifBold.ttf"],
    ["_serif",      "./fonts/Default_Serif.ttf"],
    ["_typewriter", "./fonts/Default_TypewriterBold.ttf"],
    ["_typewriter", "./fonts/Default_Typewriter.ttf"]
  ];

  function boot() {
    try {
      var ruffle = window.RufflePlayer.newest();
      var player = ruffle.createPlayer();
      player.id = "rufflePlayer";
      document.getElementById("stage").appendChild(player);
      var hint = document.getElementById("hint");

      (async function () {
        var rp = player.ruffle();
        /* 关键修复:按"游戏请求的字体名"逐个注册(addFont 的名字必须是字体名,不是 URL) */
        /* 第一步:先加载 SWF(引擎实例此时才真正就绪) */
        try { rp.load("1.swf"); } catch (e) { errs0 = String(e); }
        var errs0 = "";
        /* 第二步:等引擎就绪,再按"游戏请求的字体名"逐个注册 */
        var ok = 0, fail = 0, errs = [];
        await new Promise(function (r) { setTimeout(r, 2000); });

        var fontsCache = [];
        for (var i = 0; i < FONT_MAP.length; i++) {
          try {
            var res = await fetch(FONT_MAP[i][1]);
            if (!res.ok) { fail++; errs.push(FONT_MAP[i][1] + " HTTP " + res.status); continue; }
            fontsCache.push([FONT_MAP[i][0], new Uint8Array(await res.arrayBuffer())]);
          } catch (e) { fail++; errs.push(FONT_MAP[i][1] + " fetch失败"); }
        }

        function tryRegister(tag) {
          ok = 0; var e2 = [];
          for (var k = 0; k < fontsCache.length; k++) {
            try { rp.addFont(fontsCache[k][0], fontsCache[k][1]); ok++; }
            catch (err) { e2.push(String(err && err.message || err)); }
          }
          window.__fontDiag = { phase: tag, ok: ok, fail: fail, errs: errs.slice(0,3), regErrs: e2.slice(0,2), total: fontsCache.length, hasRuffle: !!rp };
          return ok;
        }

        tryRegister("after-load");
        /* 若一个都没成功,再等一会儿重试一次 */
        if (ok === 0) {
          await new Promise(function (r) { setTimeout(r, 4000); });
          tryRegister("retry");
        }
        if (hint) hint.textContent = "字体 " + ok + "/" + fontsCache.length + (errs0 ? " · load错误:" + errs0.slice(0,40) : "");
        rp.load("1.swf");
        initKb();
      })();
    } catch (e) {
      document.getElementById("hint").textContent = "初始化失败: " + e.message;
    }
  }

  if (document.readyState === "complete") { boot(); }
  else { window.addEventListener("load", boot); }
})();
</script>
</body>
</html>
